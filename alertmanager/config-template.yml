route:
    receiver: 'all_receiver'

receivers:
    - name: 'all_receiver'
      email_configs:
          - send_resolved: true
            to: alerts@mobeigi.com
            from: Observability <obs@mobeigi.com>
            smarthost: ${ALERTMANAGER_SMTP_HOST}
            auth_username: ${ALERTMANAGER_SMTP_USERNAME}
            auth_password: ${ALERTMANAGER_SMTP_PASSWORD}